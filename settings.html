<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f27">
  <title>Sozlamalar | DEXO GTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <a class="back" href="index.html">Orqaga</a>
      <h1>Sozlamalar</h1>
      <p class="saved" id="saved" role="status" aria-live="polite"></p>
    </header>

    <section class="group">
      <h2>Grafika</h2>

      <div class="row">
        <div class="row-text">
          <span class="row-title">Grafika sifati</span>
          <span class="row-hint">Telefon qizisa yoki o‘yin sekin ishlasa, pastroq tanlang.</span>
        </div>
        <div class="seg" role="radiogroup" aria-label="Grafika sifati">
          <label><input type="radio" name="quality" value="low" data-setting="quality"><span>Past</span></label>
          <label><input type="radio" name="quality" value="medium" data-setting="quality"><span>O‘rta</span></label>
          <label><input type="radio" name="quality" value="high" data-setting="quality"><span>Yuqori</span></label>
        </div>
      </div>

      <label class="row row--toggle">
        <span class="row-text">
          <span class="row-title">Soyalar</span>
          <span class="row-hint">“Past” sifatda soyalar har doim o‘chiq.</span>
        </span>
        <input class="switch" type="checkbox" data-setting="shadows">
      </label>

      <label class="row row--toggle">
        <span class="row-text">
          <span class="row-title">FPS ko‘rsatish</span>
          <span class="row-hint">Ekran burchagida soniyasiga kadrlar soni.</span>
        </span>
        <input class="switch" type="checkbox" data-setting="showFps">
      </label>
    </section>

    <section class="group">
      <h2>Boshqaruv</h2>

      <div class="row row--range">
        <div class="row-text">
          <span class="row-title">Kamera masofasi</span>
          <output class="row-value" data-output="cameraDistance"></output>
        </div>
        <input class="range" type="range" min="7" max="20" step="1" data-setting="cameraDistance" aria-label="Kamera masofasi">
      </div>

      <div class="row row--range">
        <div class="row-text">
          <span class="row-title">Rul sezgirligi</span>
          <output class="row-value" data-output="sensitivity"></output>
        </div>
        <input class="range" type="range" min="0.6" max="1.6" step="0.1" data-setting="sensitivity" aria-label="Rul sezgirligi">
      </div>
    </section>

    <section class="group">
      <h2>Xarita</h2>
      <label class="row row--toggle">
        <span class="row-text">
          <span class="row-title">Tayyor shahar modeli</span>
          <span class="row-hint">assets/procedural_city_6.glb fayli kerak. Fayl 90 MB, faqat kuchli telefonlar uchun. Model ichidagi binolarga urilib bo‘lmaydi.</span>
        </span>
        <input class="switch" type="checkbox" data-setting="useCityModel">
      </label>
    </section>

    <section class="group">
      <h2>Ma‘lumotlar</h2>
      <div class="actions">
        <button class="btn btn--ghost btn--small" type="button" id="resetSettings">Sozlamalarni tiklash</button>
        <button class="btn btn--danger" type="button" id="clearZone">Saqlangan zonani o‘chirish</button>
      </div>
    </section>
  </main>
  <script type="module" src="settings.js"></script>
</body>
</html>
