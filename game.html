<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1b1f27">
  <title>DEXO GTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="game.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
  <canvas id="scene"></canvas>

  <div class="hud">
    <button class="hud-btn" id="pauseBtn" type="button" aria-label="Pauza"><span></span><span></span></button>
    <div class="fps" id="fps" hidden></div>
    <canvas class="minimap" id="minimap"></canvas>
    <div class="speed" aria-live="off"><span class="speed-value" id="speedValue">0</span><span class="speed-unit">km/soat</span></div>

    <a class="open-link" id="openLink" href="#" target="_blank" rel="noopener noreferrer" hidden>Open</a>

    <div class="pad pad--left">
      <div class="wheel" id="wheel" role="slider" aria-label="Rul" aria-valuemin="-90" aria-valuemax="90" aria-valuenow="0">
        <div class="wheel-rim" id="wheelRim">
          <div class="wheel-spoke"></div>
        </div>
      </div>
    </div>

    <div class="pad pad--right">
      <button class="ctl ctl--hand" type="button" data-key="hand">Qo‘l tormozi</button>
      <div class="pad-stack">
        <button class="aux-btn aux-btn--light" id="lightBtn" type="button" aria-label="Chiroq" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1v.5h5v-.5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" /></svg>
        </button>
        <button class="aux-btn aux-btn--horn ctl" id="hornBtn" type="button" data-key="horn" aria-label="Signal">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10v4a1 1 0 0 0 1 1h2l6 4.5V4.5L7 9H5a1 1 0 0 0-1 1z" />
            <path d="M17 9c1.7 1.7 1.7 5.3 0 7" />
            <path d="M20 6.5c3 3 3 8 0 11" />
          </svg>
        </button>
        <button class="ctl ctl--gas" type="button" data-key="gas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 15 8-8 8 8" /></svg>
          <span>Gaz</span>
        </button>
        <button class="ctl ctl--brake" type="button" data-key="brake">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 9 8 8 8-8" /></svg>
          <span>Tormoz</span>
        </button>
      </div>
    </div>
  </div>

  <div class="rotate-hint" id="rotateHint" hidden>
    <p>Telefonni yon tomonga burib ushlang. Teskari chiqsa, tugmani bosing.</p>
    <button type="button" id="flipSide">Tomonni almashtirish</button>
  </div>

  <div class="overlay" id="pause" hidden>
    <div class="card">
      <h1>Pauza</h1>
      <button class="btn btn--primary" type="button" id="resumeBtn">Davom etish</button>
      <button class="btn btn--ghost" type="button" id="vehicleSwitchBtn">Ulovni almashtirish (mashina / vertolyot / samolyot)</button>
      <button class="btn btn--ghost" type="button" id="flipSide2" hidden>Tomonni almashtirish</button>
      <a class="btn btn--ghost" href="index.html">Bosh menyu</a>
    </div>
  </div>

  <div class="overlay" id="loading">
    <div class="card">
      <h1>DEXO GTA</h1>
      <p id="loadingText">Zona tayyorlanmoqda…</p>
      <div class="bar"><div class="bar-fill" id="loadingBar"></div></div>
    </div>
  </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
