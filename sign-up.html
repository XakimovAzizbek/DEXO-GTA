<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1320">
  <title>Ro‘yxatdan o‘tish — DEXO GTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sign-up.css">

  <!-- App Check (reCAPTCHA Enterprise) uchun kerak -->
  <script src="https://www.google.com/recaptcha/enterprise.js?render=6LfovuctAAAAAPAPijuA3DkCrtYV2wJTBhXNWoe2"></script>
</head>
<body class="authing">
  <main class="stage">
    <h1 class="wordmark">DEXO<br>GTA</h1>
    <p class="tagline">Davom etish uchun email va parolingizni kiriting</p>

    <form id="authForm" class="auth-form" novalidate>
      <label class="field">
        <span>Email</span>
        <input type="email" id="email" name="email" autocomplete="email" inputmode="email"
               autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="misol@gmail.com" required>
      </label>

      <label class="field">
        <span>Parol</span>
        <div class="pass-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password"
                 minlength="6" placeholder="Kamida 6 ta belgi" required>
          <button type="button" id="togglePass" class="pass-toggle" aria-label="Parolni ko‘rsatish">Ko‘rsat</button>
        </div>
      </label>

      <button type="submit" id="submitBtn" class="submit-btn">Davom etish</button>
    </form>

    <p class="hint">Hisobingiz bo‘lsa — kirasiz, bo‘lmasa — yangi hisob avtomatik yaratiladi.</p>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <p class="error" id="error" role="alert"></p>
  </main>
  <script type="module" src="sign-up.js"></script>
</body>
</html>
