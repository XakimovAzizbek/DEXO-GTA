<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1b1f27">
  <title>Mashina sozlash | DEXO GTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="car-editor.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header class="bar">
    <a class="bar-btn" href="car.html">Orqaga</a>
    <h1>Mashina sozlash</h1>
    <div class="bar-actions">
      <a class="bar-btn" id="test" href="game.html?draft=1">Sinash</a>
      <button class="bar-btn bar-btn--hazard" type="button" id="save">Saqlash</button>
    </div>
  </header>

  <!-- Oyin ekrani shu yerda aynan o'yindagi nisbatda ko'rinadi -->
  <main class="stage" id="stage">
    <div class="frame" id="frame"><div class="guides" id="guides"></div></div>
  </main>

  <section class="panel" id="panel">
    <div class="panel-top">
      <div class="cars" id="cars" role="listbox" aria-label="Mashinalar"></div>
      <button class="fold" type="button" id="fold" aria-expanded="true">Yashirish</button>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="camera" class="is-active">Kamera</button>
      <button type="button" role="tab" data-tab="car">Mashina</button>
      <button type="button" role="tab" data-tab="lights">Chiroq</button>
      <button type="button" role="tab" data-tab="test">Sinov</button>
    </div>

    <div class="body" id="body">
      <div class="rows" data-tabpanel="camera"></div>

      <div class="rows" data-tabpanel="car" hidden>
        <div class="row row--flip" id="flipRow">
          <span class="row-label">Oldi va orqa tomon</span>
          <button type="button" class="mini" id="flip">Normal</button>
        </div>
      </div>

      <div class="rows" data-tabpanel="lights" hidden>
        <div class="light-list" id="lightList"></div>
        <div class="light-actions">
          <button type="button" class="mini" id="lightAdd">+ Chiroq qo‘shish</button>
          <button type="button" class="mini mini--danger" id="lightDel" disabled>O‘chirish</button>
        </div>
        <p class="note" id="lightEmpty">Bu mashinada chiroq yo‘q. “Chiroq qo‘shish” ni bosing, keyin shakl, rang va joyini tanlang.</p>

        <div class="light-form" id="lightForm" hidden>
          <label class="field"><span class="row-label">Shakl</span><select id="lShape"></select></label>
          <label class="field"><span class="row-label">Qachon yonadi</span><select id="lFunc"></select></label>
          <div class="field">
            <span class="row-label">Rangi</span>
            <div class="swatches" id="lSwatches"></div>
            <label class="custom-color"><span>Boshqa rang:</span><input type="color" id="lColor" aria-label="Boshqa rang tanlash"></label>
          </div>
          <div class="rows" id="lightRows"></div>
          <label class="check"><input type="checkbox" id="lMirror"><span>Ikkala tomonga ham qo‘yish (juft chiroq)</span></label>
        </div>

        <div class="preview">
          <span class="row-label">Ko‘rish uchun yoqib qo‘yish:</span>
          <label class="check"><input type="checkbox" id="pvBrake" checked><span>Tormoz bosilgan</span></label>
          <label class="check"><input type="checkbox" id="pvReverse" checked><span>Orqaga yurish</span></label>
          <label class="check"><input type="checkbox" id="pvButton" checked><span>Chiroq tugmasi bosilgan</span></label>
        </div>
      </div>

      <div class="rows" data-tabpanel="test" hidden>
        <label class="check"><input type="checkbox" id="demo"><span>Burilish namoyishi: kamera ergashishi va engashishni ko‘rish</span></label>
        <label class="check"><input type="checkbox" id="guideChk" checked><span>Markaz chiziqlarini ko‘rsatish</span></label>
        <button type="button" class="mini mini--danger" id="reset">Standart qiymatlarga qaytarish</button>
      </div>
    </div>
  </section>

  <div class="loading" id="loading" hidden>
    <p id="loadingText">Mashina yuklanmoqda…</p>
    <div class="bar-track"><div class="bar-fill" id="loadingBar"></div></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="car-editor.js"></script>
</body>
</html>
